- title: "Neural Spectral Capacity: An Architectural Quantity from Network Specification Alone"
  authors: ["Chenyu Zhu", "Ruoyu Zhao", "Zhichao Lu^"]
  badge: "NeurIPS 2026"
  venue: "Advances in Neural Information Processing Systems (NeurIPS), 2026"
  status: accepted
  featured: true
  image: /assets/img/papers/nsc.webp
  tldr: "A closed-form, spectrum-based measure of architectural capacity computed from the specification alone, with an exact solver that finds the best architecture under a budget in seconds on a CPU."
