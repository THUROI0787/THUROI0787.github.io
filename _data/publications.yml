# ---------------- Selected (his own line of work first) ----------------
- title: "Dyn-SSM: Towards Efficient Long Sequence Learning via Bio-interpretable Dynamics in Spiking State Space Models"
  authors: ["Yan Zhong*", "Ruoyu Zhao*", "Chao Wang", "Jiaqi He", "Qinghui Guo", "Jianguo Zhang", "Zhichao Lu", "Luziwei Leng^"]
  role: co-first
  badge: "IEEE TCDS"
  venue: "IEEE Transactions on Cognitive and Developmental Systems (TCDS), 2026"
  status: published
  featured: true
  image: /assets/img/papers/dyn-ssm.webp
  tldr: "Spiking state space models that keep bio-interpretable neuron dynamics yet still train in parallel, reaching high sparsity and strong accuracy on long-sequence benchmarks."
  links:
    - { label: "Paper", icon: "fa-solid fa-file-lines", url: "https://ieeexplore.ieee.org/document/11541194" }

- title: "Large Language Model-Guided Evolutionary Discovery of Native Neural Architectures for Spiking Sequence Modeling"
  authors: ["Ruoyu Zhao*", "Jiaqi Wu*", "Chenyu Zhu", "Zhichao Lu^"]
  role: co-first
  badge: "Preprint"
  venue: "Preprint · under review"
  status: review
  featured: true
  image: /assets/img/papers/openarchevo.webp
  tldr: "OpenArchEvo lets LLMs evolve executable architecture code in an open program space. Its NeuroGate design outperforms DeltaNet on WikiText-103, and discovered models cut estimated energy by up to 50.6× versus a dense Transformer."
  links:
    - { label: "arXiv", icon: "fa-solid fa-file-pdf", url: "https://arxiv.org/abs/2609.40258" }
    - { label: "Code", icon: "fa-brands fa-github", url: "https://github.com/Optima-CityU/OpenArchEvo" }
    - { label: "Project", icon: "fa-solid fa-globe", url: "https://optima-cityu.github.io/OpenArchEvo/" }

- title: "Neural Spectral Capacity: Measuring and Designing Architectures from Network Specification Alone"
  authors: ["Chenyu Zhu", "Ruoyu Zhao", "Zhichao Lu^"]
  badge: "NeurIPS 2026"
  venue: "Advances in Neural Information Processing Systems (NeurIPS), 2026"
  status: accepted
  featured: true
  image: /assets/img/papers/nsc.webp
  tldr: "A closed-form, spectrum-based capacity score computed from the architecture specification alone, with a dynamic-programming solver. It ranks architectures better than #Params, #FLOPs and training-free proxies across seven families, and prunes LLaMA-7B to 5.7B without calibration data."
  links:
    - { label: "arXiv", icon: "fa-solid fa-file-pdf", url: "https://arxiv.org/abs/2609.23087" }

- title: "Rare Gate Disagreements Can Limit Plasticity: When Gradient Flow Mispredicts Finite-Batch SGD"
  authors: ["Ruoyu Zhao", "Mingxuan Zhang", "Jianbo Dai", "Jiaqi Wu", "Chenyu Zhu", "Tong Che^"]
  role: first
  badge: "Preprint"
  venue: "Preprint · under review"
  status: review
  featured: true
  image: /assets/img/papers/rare-gate.webp
  tldr: "Gradient flow predicts that a pretrained network recovers on a new task, yet finite-batch SGD can fail for a horizon exponential in 1/η. We trace the gap to rarely sampled inputs on which ReLU gates disagree."
  links:
    - { label: "arXiv", icon: "fa-solid fa-file-pdf", url: "https://arxiv.org/abs/2610.11475" }

- title: "Shared Gaussianization: What Gaussian Regularizers Certify About Contrastive Learning, and What They Miss"
  authors: ["Ruoyu Zhao", "Yuting Chen", "Jinheng Zhang", "Zhehao Zou", "Tong Che^"]
  role: first
  badge: "Preprint"
  venue: "Preprint · under review"
  status: review
  featured: true
  image: /assets/img/papers/shared-gauss.webp
  tldr: "A Gaussianity test on averaged views vanishes exactly at InfoNCE's optima and sharply bounds its excess risk; away from the optimum, it needs an explicit alignment term to avoid keeping per-view nuisance."
  links:
    - { label: "arXiv", icon: "fa-solid fa-file-pdf", url: "https://arxiv.org/abs/2610.10299" }

