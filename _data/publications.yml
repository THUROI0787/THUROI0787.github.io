# Publications & projects, organized around the research themes in research.yml.
# authors: "*" after a name = equal contribution, "^" = corresponding author.
# themes:  list of research theme ids (1-4) -> small icons on each entry and the filter bar.
# role:    first | co-first  (adds a small tag)
# group:   featured -> large card with figure + summary (shown in file order)
