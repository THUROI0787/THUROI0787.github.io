# status:  published | accepted | review | project

# ============ 1 · Automated scientific discovery ============
- title: "Large Language Model-Guided Evolutionary Discovery of Native Neural Architectures for Spiking Sequence Modeling"
  authors: ["Ruoyu Zhao*", "Jiaqi Wu*", "Chenyu Zhu", "Zhichao Lu^"]
  themes: [1, 2]
  role: co-first
  group: featured
  badge: "Preprint"
  venue: "Preprint · under review"
  status: review
  image: /assets/img/papers/openarchevo.webp
  tldr: "OpenArchEvo lets LLMs evolve executable architecture code in an open program space with multi-island evolution. Its NeuroGate design outperforms DeltaNet on WikiText-103, and discovered models cut estimated energy by up to 50.6× versus a dense Transformer."
  links:
    - { label: "arXiv", icon: "fa-solid fa-file-pdf", url: "https://arxiv.org/abs/2609.40258" }
    - { label: "Code", icon: "fa-brands fa-github", url: "https://github.com/Optima-CityU/OpenArchEvo" }
    - { label: "Project", icon: "fa-solid fa-globe", url: "https://optima-cityu.github.io/OpenArchEvo/" }

- title: "OpenArchEvo × SciencePal: Agents Propose, Evolution Decides"
  authors: []
  byline: "OpenArchEvo v1.5 · with the SciencePal platform · Global AI4Science Hackathon 2026"
  themes: [1, 2]
  group: featured
  badge: "Project"
  venue: "Research project · Global AI4Science Hackathon 2026 (AI Agent track)"
  status: project
  image: /assets/img/papers/openarchevo-v15.webp
  tldr: "A team of AI research agents on SciencePal guides OpenArchEvo's evolutionary search. With the agents, final designs clearly worse than the expert's drop from 6 of 12 to 0 of 12, across 1,380 trainings run by the agents."
  links:
    - { label: "Project", icon: "fa-solid fa-globe", url: "https://optima-cityu.github.io/OpenArchEvo-SciencePal/" }

