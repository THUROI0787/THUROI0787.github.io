# Markdown is allowed in each paragraph
about:
  - >-
    I'm a PhD student in the [Department of Computer Science](https://www.cs.cityu.edu.hk/)
    at [City University of Hong Kong](https://www.cityu.edu.hk/), advised by
    [Prof. Zhichao Lu](https://www.cs.cityu.edu.hk/~zhichalu/) and Prof. Qingfu Zhang.
    I am also the **co-founder and CTO of [BrainGalaxy](https://brain-galaxy.omniex.ai/)
    (硅基智宇)**, where we build energy-efficient AI by co-designing brain-inspired
    algorithms with memristor-based compute-in-memory chips.
  - >-
    The human brain runs on about 20 watts, yet it learns continually, reasons in real time,
    and adapts to the world around it. My research asks which of its principles we can carry
    over to silicon: spiking and state-space dynamics for efficient sequence modeling, principled
    ways to measure and discover neural architectures, and the optimization dynamics that decide
    what networks can still learn.
  - >-
    Before CityU, I received my B.Eng. from the
    [Department of Electronic Engineering, Tsinghua University](https://www.ee.tsinghua.edu.cn/en/),
    with a minor in Statistics, and did research at Tsinghua, UIUC, and NUS.
