tagline: "Brain-inspired principles for next-generation AI, from theory to chips."

# Markdown is allowed in each paragraph
about:
  - >-
    I'm a PhD student in Computer Science at [City University of Hong Kong](https://www.cs.cityu.edu.hk/),
    advised by [Prof. Zhichao Lu](https://www.cs.cityu.edu.hk/~zhichalu/) and Prof. Qingfu Zhang.
    I study what brains and silicon each do well, and how the brain's strengths can shape the next
    generation of AI.
  - >-
    The brain learns continually, computes sparsely, and runs on about 20 watts. My work follows
    four threads: automating scientific discovery with LLM-guided evolution and multi-agent systems,
    which we use to design new neural architectures; spiking and brain-inspired models and learning
    rules; understanding how today's architectures and optimizers work; and co-designing these models
    with memristor hardware.
  - >-
    I received my B.Eng. in Electronic Engineering from [Tsinghua University](https://www.tsinghua.edu.cn/en/)
    (minor in Statistics), and did research at Tsinghua, UIUC, and NUS. I'm open to research collaborations
    on brain-inspired learning and efficient architectures. Feel free to [email me](mailto:thuroi175007@gmail.com).

