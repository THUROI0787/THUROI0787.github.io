# Research themes. "id" is referenced by publications (themes: [1, 2]) to show theme icons.
# "side" places the card on the carbon (brain) / silicon (chip) spectrum.
- id: 1
  short: "Auto-discovery"
  title: "Automated scientific discovery"
  icon: "fa-solid fa-dna"
  side: mix
  text: "LLM-guided evolutionary search and multi-agent systems that propose, test, and refine designs on their own: neural architectures today, algorithms and chip design next."
- id: 2
  short: "Brain-inspired"
  title: "Spiking & brain-inspired learning"
  icon: "fa-solid fa-brain"
  side: carbon
  text: "Neuron-like dynamics for efficient sequence models, and brain-like ways to learn: online, forward-only, and zeroth-order adaptation."
- id: 3
  short: "Understanding ANNs"
  title: "Understanding modern neural networks"
  icon: "fa-solid fa-magnifying-glass-chart"
  side: mix
  text: "How today's architectures and optimizers work, and how to use that: capacity measured from the specification alone, SGD and plasticity, efficient deployment."
- id: 4
  short: "Hardware"
  title: "Algorithm–hardware co-design"
  icon: "fa-solid fa-microchip"
  side: silicon
  text: "Memristor compute-in-memory devices, and bringing brain-inspired models onto them for low-power AI at the edge."
