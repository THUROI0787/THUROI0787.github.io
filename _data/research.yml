# Research themes: "side" places the card on the carbon (brain) / silicon (chip) spectrum
- title: "Brain-inspired computation"
  icon: "fa-solid fa-brain"
  side: carbon
  text: "Spiking neurons and state space models that keep rich neural dynamics while staying sparse, parallel, and energy-efficient on long sequences."
- title: "Neural architecture"
  icon: "fa-solid fa-diagram-project"
  side: mix
  text: "Measuring architectures from their specification alone, and letting LLM-guided evolution discover native spiking architectures."
- title: "Learning dynamics & theory"
  icon: "fa-solid fa-wave-square"
  side: mix
  text: "When gradient flow mispredicts SGD, what Gaussian regularizers certify about contrastive learning, and what limits plasticity."
- title: "Hardware co-design"
  icon: "fa-solid fa-microchip"
  side: silicon
  text: "Memristor-based compute-in-memory devices and algorithm–chip co-design for low-latency AI at the edge."
