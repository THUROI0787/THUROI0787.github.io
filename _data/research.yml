# Research themes: "side" places the card on the carbon (brain) / silicon (chip) spectrum
- title: "Spiking & brain-inspired models"
  icon: "fa-solid fa-brain"
  side: carbon
  text: "Sequence models with neuron-like dynamics that stay sparse, parallel to train, and energy-efficient."
- title: "Measuring & discovering architectures"
  icon: "fa-solid fa-diagram-project"
  side: mix
  text: "Scoring architectures from their specification alone, and using LLM-guided evolution to find architectures built for spiking networks."
- title: "Learning dynamics & plasticity"
  icon: "fa-solid fa-wave-square"
  side: mix
  text: "When does a network stop being able to learn? Theory of SGD, plasticity, and what self-supervised objectives guarantee."
- title: "Algorithm–hardware co-design"
  icon: "fa-solid fa-microchip"
  side: silicon
  text: "Bringing brain-inspired models onto memristor compute-in-memory chips for low-power AI at the edge."
